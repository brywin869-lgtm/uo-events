name: Update UO events
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build.py
      - name: Commit changes
        run: |
          git config user.name "uo-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Update events" && git push)
